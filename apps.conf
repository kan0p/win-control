# Catálogo de apps de Windows que win puede abrir.
# clave | nombre | grupo | ejecutable en Windows | id en Office (ODT) | ícono
#   grupo: office (se instala con Office) o windows (ya viene con Windows)
#   ícono: carpeta de íconos de WinApps (apps/<carpeta>/icon.svg) o nombre de ícono del tema
word       | Word                | office  | C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE  | Word       | word-o365
excel      | Excel               | office  | C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE    | Excel      | excel-o365
ppt        | PowerPoint          | office  | C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE | PowerPoint | powerpoint-o365
outlook    | Outlook             | office  | C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE  | Outlook    | outlook-o365
onenote    | OneNote             | office  | C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE  | OneNote    | onenote-o365
access     | Access              | office  | C:\Program Files\Microsoft Office\root\Office16\MSACCESS.EXE | Access     | access-o365
notas      | Bloc de notas       | windows | C:\Windows\System32\notepad.exe                              | -          | accessories-text-editor
cmd        | Símbolo del sistema | windows | C:\Windows\System32\cmd.exe                                  | -          | cmd
powershell | PowerShell          | windows | C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe    | -          | powershell
explorador | Explorador          | windows | C:\Windows\explorer.exe                                      | -          | explorer
paint      | Paint               | windows | C:\Windows\System32\mspaint.exe                              | -          | mspaint
